<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="font-family:var(--font-mono);font-weight:500;font-size:12px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent)">Claude Code Plugins</div>
    <div style="display:flex;gap:8px">
      <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 9px;border-radius:4px">Productivity</span>
      <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);border:1px solid var(--line-strong);padding:4px 9px;border-radius:4px">Execution</span>

    <div style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--fg-3)">v0.4.2 · 5 min read · ⭐22</div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:16px">The signature motif: wide-tracked UPPERCASE mono micro-labels (0.18em / 0.14em).</div>
