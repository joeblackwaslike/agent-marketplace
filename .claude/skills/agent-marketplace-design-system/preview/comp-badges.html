<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div style="display:flex;gap:9px;flex-wrap:wrap;align-items:center">
    <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 9px;border-radius:4px">Productivity</span>
    <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#7aa2ff;background:rgba(122,162,255,0.10);border:1px solid rgba(122,162,255,0.28);padding:4px 9px;border-radius:4px">Execution</span>
    <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:#ff9e64;background:rgba(255,158,100,0.10);border:1px solid rgba(255,158,100,0.28);padding:4px 9px;border-radius:4px">Memory</span>
    <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg-3);background:var(--surface-2);border:1px solid var(--line-strong);padding:4px 9px;border-radius:4px">Utilities</span>
  </div>
  <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:16px">
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:4px 9px">lessons</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:4px 9px">mcp</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:4px 9px">sandbox</span>
    <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:4px 9px">memory</span>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4);margin-top:14px">Category badges (accent + muted) · keyword pills</div>
</body></html>
