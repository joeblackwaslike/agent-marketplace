<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:24px 26px;background:#070907}
  h1{font-family:var(--font-mono);font-weight:600;font-size:16px;letter-spacing:-0.02em;color:#e9ece6;margin:0 0 4px}
  .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#767f76;margin-bottom:22px}
  .stack{display:flex;flex-direction:column;gap:30px}
  .dhead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .dnum{font-family:var(--font-mono);font-weight:700;font-size:13px;color:#e9ece6}
  .dhex{font-family:var(--font-mono);font-size:11px;color:#767f76;letter-spacing:0.03em}
  .dhead .line{flex:1;height:1px;background:#232a24}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}

  /* token sets */
  .dk{--bg:#0a0c0a;--s1:#111512;--s2:#161b17;--fg1:#e9ece6;--fg2:#aab2a8;--fg3:#767f76;--ln:#232a24;--lns:#364038}
  .lt{--bg:#f5f4ee;--s1:#fbfaf6;--s2:#eeece3;--fg1:#16180f;--fg2:#44473a;--fg3:#717566;--ln:#dddbcd;--lns:#c7c4b2}

  .panel{border:1px solid var(--ln);border-radius:var(--r-lg);overflow:hidden;background:var(--bg);position:relative}
  .ptag{position:absolute;top:9px;right:11px;font-family:var(--font-mono);font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--fg3);z-index:2}
  .pnav{display:flex;align-items:center;gap:16px;height:44px;padding:0 15px;border-bottom:1px solid var(--ln);background:var(--s1)}
  .wm{font-family:var(--font-mono);font-weight:600;font-size:13px;letter-spacing:-0.03em;color:var(--fg1)} .wm i{color:var(--ac);font-style:normal}
  .nl{display:flex;gap:13px;flex:1} .nl a{font-family:var(--font-mono);font-size:11px;color:var(--fg3)} .nl a.on{color:var(--ac)}
  .ndot{width:7px;height:7px;border-radius:50%;background:var(--ac)}
  .phero{padding:22px 18px 20px}
  .chip{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:10px;letter-spacing:0.03em;color:var(--fg2);border:1px solid var(--lns);border-radius:100px;padding:4px 10px;margin-bottom:14px}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--ac)}
  .dh1{font-family:var(--font-mono);font-weight:700;font-size:30px;line-height:1;letter-spacing:-0.04em;color:var(--fg1);margin:0 0 12px;display:flex;align-items:center}
  .dh1 i{color:var(--fg3);font-style:normal;font-weight:400}
  .dh1 .cur{width:4px;height:26px;background:var(--ac);margin-left:5px;display:inline-block}
  .dsub{font-family:var(--font-body);font-size:13px;line-height:1.5;color:var(--fg2);margin:0 0 16px}
  .ctas{display:flex;gap:9px;margin-bottom:16px}
  .b1{font-family:var(--font-mono);font-weight:500;font-size:12px;padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--ac);background:var(--ac);color:var(--ac-ink);cursor:pointer}
  .b2{font-family:var(--font-mono);font-weight:500;font-size:12px;padding:9px 15px;border-radius:var(--r-sm);border:1px solid var(--lns);background:transparent;color:var(--fg1);cursor:pointer}
  .snip{display:flex;align-items:center;gap:8px;background:var(--s2);border:1px solid var(--ln);border-radius:var(--r-sm);padding:9px 11px}
  .snip .pp{color:var(--ac);font-family:var(--font-mono);font-size:12px}
  .snip code{font-family:var(--font-mono);font-size:10.5px;color:var(--fg1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .snip .cp{font-family:var(--font-mono);font-size:9px;color:var(--ac);border:1px solid var(--ac-line);border-radius:3px;padding:3px 7px}
  .prow{padding:0 18px 20px}
  .pcard{background:var(--s1);border:1px solid var(--ln);border-radius:var(--r-md);padding:14px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
  .pcard::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--ac)}
  .badge{align-self:flex-start;font-family:var(--font-mono);font-weight:500;font-size:9px;letter-spacing:0.14em;text-transform:uppercase;color:var(--ac);background:var(--ac-soft);border:1px solid var(--ac-line);padding:3px 7px;border-radius:3px}
  .pn{font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:-0.02em;color:var(--fg1)}
  .pd{font-family:var(--font-body);font-size:11.5px;line-height:1.45;color:var(--fg2);margin:0}
  .src{font-family:var(--font-mono);font-size:10px;color:var(--ac);align-self:flex-end}
</style>
</head>
<body>
  <h1>Accent in context — dark + light, 80 pairs</h1>
  <div class="sub">each accent tuned per theme (bright on carbon · deepened on paper) · call out the numbers</div>
  <div class="stack" id="stack"></div>

  <script>
    function hslHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l);const f=n=>l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1));const to=x=>Math.round(255*x).toString(16).padStart(2,'0');return '#'+to(f(0))+to(f(8))+to(f(4));}
    function rgb(hex){return [parseInt(hex.slice(1,3),16),parseInt(hex.slice(3,5),16),parseInt(hex.slice(5,7),16)];}
    function rgba(hex,a){const [r,g,b]=rgb(hex);return 'rgba('+r+','+g+','+b+','+a+')';}

    const stack=document.getElementById('stack');
    const N=80;
    let html='';
    for(let i=0;i<N;i++){
      const h=Math.round(i/N*360);
      // dark: bright accent on carbon
      const lD=(h>40&&h<75)?54:60;
      const acD=hslHex(h,82,lD);
      // light: deepened accent for AA contrast on paper
      const lL=(h>40&&h<75)?34:40;
      const acL=hslHex(h,74,lL);
      const dkVars='--ac:'+acD+';--ac-ink:#0a0c0a;--ac-soft:'+rgba(acD,0.13)+';--ac-line:'+rgba(acD,0.34)+';';
      const ltVars='--ac:'+acL+';--ac-ink:#ffffff;--ac-soft:'+rgba(acL,0.12)+';--ac-line:'+rgba(acL,0.30)+';';
      const body=(tag)=>
        '<div class="ptag">'+tag+'</div>'+
        '<div class="pnav"><span class="wm">joeblack<i>.nyc</i></span><span class="nl"><a class="on">Plugins</a><a>Writing</a><a>Projects</a></span><span class="ndot"></span></div>'+
        '<div class="phero">'+
          '<span class="chip"><span class="dot"></span> NYC · agentic era</span>'+
          '<div class="dh1">joeblack<i>.nyc</i><span class="cur"></span></div>'+
          '<p class="dsub">Battle-tested plugins that make your AI coding agent smarter.</p>'+
          '<div class="ctas"><button class="b1">Explore Plugins →</button><button class="b2">Get in Touch</button></div>'+
          '<div class="snip"><span class="pp">$</span><code>claude plugin install mcp-exec</code><span class="cp">Copy</span></div>'+
        '</div>'+
        '<div class="prow"><div class="pcard"><span class="badge">Productivity</span><div class="pn">lessons-learned</div><p class="pd">Automatic mistake capture and proactive lesson injection.</p><a class="src">Source →</a></div></div>';
      html+=
      '<section>'+
        '<div class="dhead"><span class="dnum">'+String(i+1).padStart(2,'0')+'</span><span class="dhex">dark '+acD+' · light '+acL+'</span><span class="line"></span></div>'+
        '<div class="pair">'+
          '<div class="panel dk" style="'+dkVars+'">'+body('Dark')+'</div>'+
          '<div class="panel lt" style="'+ltVars+'">'+body('Light')+'</div>'+
        '</div>'+
      '</section>';
    }
    stack.innerHTML=html;
  </script>
</body>
</html>
