<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div class="row" style="align-items:flex-end">
    <div class="sw"><div class="chip" style="background:var(--surface-2);border:1px solid var(--line-strong);border-radius:3px;height:52px"></div><span class="nm">xs · 3px</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2);border:1px solid var(--line-strong);border-radius:5px;height:52px"></div><span class="nm">sm · 5px</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2);border:1px solid var(--line-strong);border-radius:8px;height:52px"></div><span class="nm">md · 8px</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2);border:1px solid var(--line-strong);border-radius:12px;height:52px"></div><span class="nm">lg · 12px</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2);border:1px solid var(--line-strong);border-radius:100px;height:52px;display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">pill</span></div><span class="nm">pill</span></div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:14px">Sharp, terminal-grade radii. Pills reserved for filter chips only.</div>
</body></html>
