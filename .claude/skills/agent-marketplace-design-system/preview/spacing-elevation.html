<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--surface-1);border:1px solid var(--line);height:64px;box-shadow:none"></div><span class="nm">rest</span><span class="hx">border only</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1);border:1px solid var(--line-strong);height:64px"></div><span class="nm">hover</span><span class="hx">line-strong</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1);border:1px solid var(--line);height:64px;box-shadow:var(--shadow-md)"></div><span class="nm">shadow-md</span><span class="hx">neutral</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1);border:1px solid var(--line);height:64px;box-shadow:var(--shadow-lg)"></div><span class="nm">shadow-lg</span><span class="hx">overlay</span></div>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3);margin-top:14px">Dark mode separates with <span style="color:var(--fg-1)">borders + surface steps</span>, not glow. Shadows are neutral-black &amp; restrained.</div>
</body></html>
