<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div class="row" style="align-items:flex-end">
    <div class="sw" style="flex:2"><div class="chip" style="background:var(--accent);height:72px;border:none;display:flex;align-items:center;justify-content:center"><span style="font-family:var(--font-mono);font-weight:700;color:var(--accent-ink);font-size:13px">CYAN-TEAL</span></div><span class="nm">accent</span><span class="hx">#45e1ed</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent-press)"></div><span class="nm">accent-press</span><span class="hx">#37b4be</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent-soft);border:1px solid var(--accent-line)"></div><span class="nm">accent-soft</span><span class="hx">12%</span></div>
    <div class="sw"><div class="chip" style="background:var(--bg);border:1px solid var(--accent-line);display:flex;align-items:center;justify-content:center"><span style="color:var(--accent);font-family:var(--font-mono);font-size:18px">$</span></div><span class="nm">accent-line</span><span class="hx">30%</span></div>
  </div>
  <div style="margin-top:14px;font-family:var(--font-mono);font-size:12px;color:var(--fg-3);display:flex;gap:8px;align-items:center">
    <span style="width:7px;height:7px;border-radius:50%;background:var(--signal);display:inline-block"></span> signal / online dot
    <span style="margin-left:14px;color:var(--fg-1)">link</span>
    <span style="color:var(--accent)">link:hover</span>
  </div>
</body></html>
