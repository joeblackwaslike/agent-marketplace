<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div style="display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);padding:11px 14px;max-width:520px">
    <span style="color:var(--accent);font-family:var(--font-mono);font-size:14px">$</span>
    <code style="font-family:var(--font-mono);font-size:13px;color:var(--fg-1);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">claude plugin marketplace add joeblackwaslike/agent-marketplace</code>
    <button style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:4px 11px;cursor:pointer;display:flex;align-items:center;gap:5px">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;max-width:520px;margin-top:12px">
    <span style="color:var(--accent);font-family:var(--font-mono);font-size:13px">$</span>
    <code style="font-family:var(--font-mono);font-size:12.5px;color:var(--fg-1);flex:1">claude plugin install mcp-exec</code>
    <button style="font-family:var(--font-mono);font-size:11px;color:var(--fg-2);background:transparent;border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:3px 10px;cursor:pointer">Copy</button>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4);margin-top:14px">Install snippet — the brand's primary CTA. Copy button → accent on hover.</div>
</body></html>
