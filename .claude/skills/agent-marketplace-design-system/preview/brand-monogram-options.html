<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css">
<style>
  body{padding:26px 28px}
  h1{font-family:var(--font-mono);font-weight:600;font-size:16px;letter-spacing:-0.02em;color:var(--fg-1);margin:0 0 4px}
  .sub{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg-3);margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:16px 14px}
  .opt{display:flex;flex-direction:column;align-items:center;gap:7px}
  .tile{width:62px;height:62px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:600;font-size:20px;letter-spacing:-0.045em;overflow:hidden}
  .num{font-family:var(--font-mono);font-size:9.5px;color:var(--fg-4);letter-spacing:0.04em}
  /* colorways */
  .surf{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--fg-1)} .surf .a{color:var(--accent)}
  .ink{background:#060806;border:1px solid var(--line);color:var(--accent)} .ink .a{color:var(--accent)}
  .out{background:transparent;border:1px solid var(--accent-line);color:var(--fg-1)} .out .a{color:var(--accent)}
  .acc{background:var(--accent);color:var(--accent-ink)} .acc .a{color:var(--accent-ink)}
  /* parts */
  .cur{display:inline-block;width:4px;height:0.92em;margin-left:2px;background:currentColor;vertical-align:-1px}
  .bar{display:block;width:22px;height:3px;margin-top:3px;background:currentColor}
  .col{display:flex;flex-direction:column;align-items:center;line-height:1}
  .stack{display:flex;flex-direction:column;align-items:center;line-height:0.82;font-size:15px}
  .stack u{display:block;width:15px;height:2px;margin:2px 0;background:currentColor}
  .tight{letter-spacing:-0.13em;font-weight:700;font-size:23px}
  .wm{display:flex;align-items:center;gap:16px;margin-top:26px;padding-top:18px;border-top:1px solid var(--line)}
  .wm b{font-family:var(--font-mono);font-weight:600;font-size:26px;letter-spacing:-0.04em;color:var(--fg-1)}
  .wm b i{color:var(--accent);font-style:normal}
  .wm span{font-family:var(--font-mono);font-size:11px;color:var(--fg-3);letter-spacing:0.04em}
</style>
</head>
<body style="background:var(--bg)">
  <h1>JB monogram — 80 options</h1>
  <div class="sub">20 marks × 4 colorways · all IBM Plex Mono · call out the numbers you like</div>
  <div class="grid" id="grid"></div>
  <div class="wm"><b>joeblack<i>.nyc</i></b><span>the wordmark stays mono — the monogram should echo it</span></div>

  <script>
    // 20 marks (inner HTML). ".a" = accent-tinted part.
    const marks = [
      '<span class="tight">JB</span>',                                  // tight monogram (caps)
      'jb',                                                             // plain lowercase
      'jb<i class="cur a"></i>',                                        // prompt caret
      '<span class="a">_</span>jb',                                     // underscore prefix
      'jb<span class="a">_</span>',                                     // underscore suffix
      'jb<span class="a">.</span>',                                     // wordmark dot
      'jb<span class="a">;</span>',                                     // semicolon
      '<span class="a">{</span>jb<span class="a">}</span>',             // braces
      '<span class="a">[</span>jb<span class="a">]</span>',             // brackets
      '<span class="a">(</span>jb<span class="a">)</span>',             // parens
      '<span class="a">&lt;</span>jb<span class="a">&gt;</span>',       // angle brackets
      '<span class="a">/</span>jb',                                     // slash prefix
      '<span class="a">~/</span>jb',                                    // home path
      '<span class="a">$</span>jb',                                     // shell var
      '<span class="a">&gt;</span>jb',                                  // prompt arrow
      '<span class="a">#</span>jb',                                     // hash
      'jb<span class="a">()</span>',                                    // function call
      'J<span class="a">·</span>B',                                     // middot
      'J<span class="a">/</span>B',                                     // slash split
      '<span class="stack">J<u class="a"></u>B</span>',                // stacked + rule
    ];
    const ways = ['surf','ink','out','acc'];
    const grid = document.getElementById('grid');
    let n = 0;
    marks.forEach(m => ways.forEach(w => {
      n++;
      const opt = document.createElement('div');
      opt.className = 'opt';
      opt.innerHTML = '<div class="tile '+w+'">'+m+'</div><span class="num">'+String(n).padStart(2,'0')+'</span>';
      grid.appendChild(opt);
    }));
  </script>
</body>
</html>
