<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg);padding:0">
  <nav style="display:flex;align-items:center;gap:28px;height:58px;padding:0 22px;background:color-mix(in srgb, var(--bg) 86%, transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(20px)">
    <a style="font-family:var(--font-mono);font-weight:600;font-size:14px;letter-spacing:-0.03em;color:var(--fg-1);text-decoration:none">joeblack<span style="color:var(--accent)">.nyc</span></a>
    <div style="display:flex;gap:24px;flex:1">
      <a style="font-family:var(--font-mono);font-size:13px;color:var(--accent);text-decoration:none">Plugins</a>
      <a style="font-family:var(--font-mono);font-size:13px;color:var(--fg-3);text-decoration:none">Writing</a>
      <a style="font-family:var(--font-mono);font-size:13px;color:var(--fg-3);text-decoration:none">Projects</a>
      <a style="font-family:var(--font-mono);font-size:13px;color:var(--fg-3);text-decoration:none">Connect</a>
    </div>
    <div style="display:flex;align-items:center;gap:14px">
      <img src="../assets/brand-icons/github.svg" width="17" height="17" style="opacity:0.5;filter:invert(1)">
      <img src="../assets/brand-icons/x.svg" width="15" height="15" style="opacity:0.5;filter:invert(1)">
      <button style="width:32px;height:32px;border:1px solid var(--line-strong);border-radius:var(--r-sm);background:transparent;color:var(--fg-3);cursor:pointer;display:flex;align-items:center;justify-content:center">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
      </button>
    </div>
  </nav>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4);padding:14px 22px">Sticky nav — hairline border + backdrop blur. Active link in accent.</div>
</body></html>
