<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--bg)"></div><span class="nm">bg</span><span class="hx">#eceff3</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-1)"></div><span class="nm">surface-1</span><span class="hx">#f8fafc</span></div>
    <div class="sw"><div class="chip" style="background:var(--surface-2)"></div><span class="nm">surface-2</span><span class="hx">#dfe5ec</span></div>
    <div class="sw"><div class="chip" style="background:var(--fg-1)"></div><span class="nm">fg-1</span><span class="hx">#0f161d</span></div>
    <div class="sw"><div class="chip" style="background:var(--fg-2)"></div><span class="nm">fg-2</span><span class="hx">#3c4753</span></div>
    <div class="sw"><div class="chip" style="background:var(--accent);border:none"></div><span class="nm">accent</span><span class="hx">#15808a</span></div>
  </div>
  <p style="font-family:var(--font-body);margin:14px 0 0;font-size:14px;color:var(--fg-2)">Light theme — <span style="color:var(--accent);font-family:var(--font-mono)">cool porcelain + slate</span>. Accent deepens to <span class="mono" style="color:var(--accent)">#15808a</span> for AA contrast.</p>
</body></html>
