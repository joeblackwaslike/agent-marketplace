<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--fg-1)"></div><span class="nm">fg-1</span><span class="hx">#e6ecf0</span></div>
    <div class="sw"><div class="chip" style="background:var(--fg-2)"></div><span class="nm">fg-2</span><span class="hx">#a6b1ba</span></div>
    <div class="sw"><div class="chip" style="background:var(--fg-3)"></div><span class="nm">fg-3</span><span class="hx">#74808a</span></div>
    <div class="sw"><div class="chip" style="background:var(--fg-4)"></div><span class="nm">fg-4</span><span class="hx">#4b555e</span></div>
  </div>
  <p style="font-family:var(--font-body);margin:16px 0 0;font-size:14px;line-height:1.5">
    <span style="color:var(--fg-1)">Primary ink.</span>
    <span style="color:var(--fg-2)"> Secondary body copy.</span>
    <span style="color:var(--fg-3)"> Muted meta &amp; captions.</span>
    <span style="color:var(--fg-4)"> Faint / disabled.</span>
  </p>
</body></html>
