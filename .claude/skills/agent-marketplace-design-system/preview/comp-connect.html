<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div style="display:flex;gap:12px">
    <a style="flex:1;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none">
      <img src="../assets/brand-icons/github.svg" width="22" height="22" style="filter:invert(1);opacity:0.85">
      <span style="font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--fg-1)">GitHub</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">@joeblackwaslike</span>
    </a>
    <a style="flex:1;background:var(--surface-1);border:1px solid var(--accent-line);border-radius:var(--r-md);padding:18px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none">
      <img src="../assets/brand-icons/substack.svg" width="22" height="22" style="filter:invert(1);opacity:0.85">
      <span style="font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--fg-1)">Substack</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--accent)">joeblackwaslike</span>
    </a>
    <a style="flex:1;background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 16px;display:flex;flex-direction:column;gap:10px;text-decoration:none">
      <img src="../assets/brand-icons/medium.svg" width="22" height="22" style="filter:invert(1);opacity:0.85">
      <span style="font-family:var(--font-mono);font-weight:500;font-size:14px;color:var(--fg-1)">Medium</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-3)">@joeblackwaslike</span>
    </a>
  </div>
  <div style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4);margin-top:13px">Connect cards — rest vs. accent-border hover.</div>
</body></html>
