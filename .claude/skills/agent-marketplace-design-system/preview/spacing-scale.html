<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg)">
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><div style="width:4px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-1 · 4px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:8px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-2 · 8px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:16px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-4 · 16px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:24px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-5 · 24px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:32px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-6 · 32px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:48px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-7 · 48px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:64px;height:16px;background:var(--accent)"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-8 · 64px</span></div>
    <div style="display:flex;align-items:center;gap:12px"><div style="width:96px;height:16px;background:var(--accent);opacity:0.6"></div><span class="mono" style="font-size:11px;color:var(--fg-3)">s-9 · 96px (section rhythm)</span></div>
  </div>
</body></html>
