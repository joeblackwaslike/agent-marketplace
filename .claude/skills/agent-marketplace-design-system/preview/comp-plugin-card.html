<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><link rel="stylesheet" href="_card.css"></head>
<body style="background:var(--bg);padding:16px">
  <article style="background:var(--surface-1);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;max-width:340px;display:flex;flex-direction:column;gap:13px;position:relative;overflow:hidden">
    <div style="position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent)"></div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-family:var(--font-mono);font-weight:500;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);border:1px solid var(--accent-line);padding:4px 9px;border-radius:4px">Productivity</span>
      <span style="font-family:var(--font-mono);font-size:11px;color:var(--fg-4)">v0.4.2</span>
    </div>
    <h3 style="font-family:var(--font-mono);font-weight:600;font-size:19px;letter-spacing:-0.02em;color:var(--fg-1);margin:2px 0 0">lessons-learned</h3>
    <p style="font-family:var(--font-body);font-size:13.5px;line-height:1.6;color:var(--fg-2);margin:0">Automatic mistake capture and proactive lesson injection for AI coding agents.</p>
    <div style="display:flex;gap:5px;flex-wrap:wrap">
      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:3px 8px">hooks</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:3px 8px">memory</span>
      <span style="font-family:var(--font-mono);font-size:10.5px;color:var(--fg-3);background:var(--surface-2);border-radius:4px;padding:3px 8px">injection</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 11px;margin-top:2px">
      <span style="color:var(--accent);font-family:var(--font-mono);font-size:12px">$</span>
      <code style="font-family:var(--font-mono);font-size:11.5px;color:var(--fg-1);flex:1">claude plugin install lessons-learned</code>
    </div>
    <div style="display:flex;justify-content:flex-end;border-top:1px solid var(--line);padding-top:12px">
      <a href="#" style="font-family:var(--font-mono);font-size:12px;color:var(--accent);text-decoration:none;font-weight:500">Source →</a>
    </div>
  </article>
</body></html>
